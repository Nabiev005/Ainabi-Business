<!doctype html>
<html lang="ky">
  <head>
    <meta charset="UTF-8" />
    <meta name="google-site-verification" content="Nm9-1kDtu12BxPgGCT3YlQJxT6s0amAb61VkXB7JAmI" />
    <meta name="google-site-verification" content="bnjMvVknZsGIxvG1tVPLAXf2cIrM0Z9P5OWwom2PNAI" />
    <!-- Multiple formats on purpose: Google Search's favicon fetcher (and
         some older crawlers/browsers) don't reliably rasterize SVG, so a
         real .ico/.png set is what actually shows up next to search results. -->
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="48x48" href="/favicon-48x48.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <!-- viewport-fit=cover: the app draws under the status/gesture bars and
         pads itself with the safe-area insets (see styles/tokens.css). -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#155DFC" />
    <meta name="color-scheme" content="light" />
    <!-- iPhone "Add to Home Screen": open full screen like an app. -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Ainabi" />

    <title>Ainabi Business — Бизнесиңиздин эсеби бир жерде</title>
    <meta
      name="description"
      content="Кыргызстандагы дүкөндөр жана чакан бизнестер үчүн товар, сатуу, склад, кардар жана карыз эсебин бир жерден башкарган заманбап система."
    />

    <!-- Open Graph / social preview (WhatsApp, Telegram, Facebook, ...) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Ainabi Business" />
    <meta property="og:title" content="Ainabi Business — Бизнесиңиздин эсеби бир жерде" />
    <meta
      property="og:description"
      content="Товар, сатуу, склад жана карыз эсебин бир жерден башкарыңыз. Кыргызстандагы бизнес үчүн жасалган."
    />
    <meta property="og:image" content="/og-banner.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />

    <!-- Twitter/X card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Ainabi Business — Бизнесиңиздин эсеби бир жерде" />
    <meta name="twitter:description" content="Товар, сатуу, склад жана карыз эсебин бир жерден башкарыңыз." />
    <meta name="twitter:image" content="/og-banner.png" />

    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <style>
      /* Shown until React mounts (replaces #root's children), so a slow
         phone connection never shows a blank white screen. */
      .boot-splash {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #f6f7fb;
      }
      .boot-splash img {
        width: 72px;
        height: 72px;
        animation: boot-pulse 1.4s ease-in-out infinite;
      }
      @keyframes boot-pulse {
        50% { transform: scale(0.92); opacity: 0.7; }
      }
    </style>
  </head>
  <body>
    <div id="root"><div class="boot-splash"><img src="/favicon.svg" alt="" /></div></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
